name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build update site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache Tycho target platform
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/.cache/tycho
          key: tycho-${{ hashFiles('pom.xml', '*/META-INF/MANIFEST.MF') }}
          restore-keys: |
            tycho-

      - name: Build
        id: build
        run: |
          set -o pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            QUALIFIER="$(printf '%s' "${GITHUB_REF_NAME}" | sed 's/[^a-zA-Z0-9_-]/_/g')"
            export QUALIFIER
          fi
          chmod +x ./build.sh
          ./build.sh 2>&1 | tee build.log
          ZIP="$(ls dist/smartypdt-update-site-*.zip | head -1)"
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"
          echo "Built: ${ZIP}"

      - name: Upload update site
        uses: actions/upload-artifact@v4
        with:
          name: smartypdt-update-site
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${{ steps.build.outputs.zip }}" --title "${GITHUB_REF_NAME}" --generate-notes

  publish:
    name: Publish update site
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download update site
        uses: actions/download-artifact@v4
        with:
          name: smartypdt-update-site
          path: incoming

      - name: Clone update site branch
        run: |
          SITE_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code "${SITE_URL}" refs/heads/update-site >/dev/null 2>&1; then
            git clone --depth 1 --branch update-site "${SITE_URL}" site
          else
            git clone --depth 1 "${SITE_URL}" site
            git -C site checkout --orphan update-site
            git -C site rm -rf . >/dev/null 2>&1 || true
          fi
          git -C site config user.name "github-actions[bot]"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add version to update site
        run: |
          chmod +x ./publish.sh
          ./publish.sh site "$(ls incoming/*.zip | head -1)" "${GITHUB_REF_NAME}"
          git -C site add -A
          git -C site commit -m "Publish ${GITHUB_REF_NAME}" || echo "nothing to commit"
          git -C site push origin update-site

      - name: Prepare pages content
        run: |
          mkdir -p public
          tar -C site --exclude=.git -cf - . | tar -C public -xf -

      - name: Setup Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
